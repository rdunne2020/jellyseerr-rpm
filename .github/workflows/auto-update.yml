name: Check for Seerr updates

on:
  schedule:
    - cron: '30 2 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: seerr-version-check
  cancel-in-progress: false

jobs:
  update-checker:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check latest stable release
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-update.py
      - uses: peter-evans/create-pull-request@v7
        id: pull-request
        with:
          branch: chore/seerr-upstream-update
          delete-branch: true
          add-paths: seerr.spec
          commit-message: 'chore: update Seerr to latest stable release'
          title: 'chore: update Seerr to latest stable release'
          body: |
            Updates the RPM version from the upstream stable release API and resets Release to 1.
            Review upstream runtime requirements and the RPM build results before merging.
      # Dispatch explicitly so default-token PR builds run without a manual approval step.
      - name: Test the update branch
        if: contains(fromJSON('["created", "updated"]'), steps.pull-request.outputs.pull-request-operation)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-seerr-rpm.yml --ref chore/seerr-upstream-update
